name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the lint gate needs the base commit of a pull request

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for root-absolute app links
        run: sh scripts/check-app-links.sh

      # The API layer (api-services, model) must only call actions of the server's schema and only use fields the schema
      # defines, as it is on the server's main. Known drift is listed with a reason in scripts/api-allow.txt. Red here
      # means: the server changed, or the web app drifted; update the web app (or record the drift).
      - name: Check out the server's schema and generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: main
          path: server
          sparse-checkout: |
            apiserver/__init__.py
            apiserver/client_generator
            apiserver/schema/services
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyhocon jinja2
      - name: The API layer agrees with the server's schema
        run: python -m apiserver.client_generator check-web --root src/app/business-logic --allow scripts/api-allow.txt
        env:
          PYTHONPATH: server

      - name: Check that every generated API method has a caller
        run: node scripts/check-unused-api-methods.mjs
      - name: Check for retired product names
        run: sh scripts/check-product-names.sh

      # The repository has a lint backlog, so only new errors in the files a pull request changes fail the job.
      - name: Lint changed files for new errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'src/*.ts' 'src/*.html')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript or HTML files."
            exit 0
          fi
          node scripts/lint-changed.mjs "$RUNNER_TEMP/base" "${FILES[@]}"

      # Checks only the lines this change adds to .scss files (diff against origin/main).
      - name: Check design tokens in changed styles
        run: sh scripts/check-design-tokens.sh

      # The specs listed in angular.json (test "include") must pass. Specs outside that list are not run yet.
      - name: Run unit tests
        run: pnpm exec ng test trains-webapp --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Run build
        run: pnpm run build

      - name: Check for production build
        run: test -f build/browser/index.html

      - name: Run widget build
        run: pnpm run build-widgets

      - name: Check for widget build
        run: test -f dist/report-widgets/browser/index.html
