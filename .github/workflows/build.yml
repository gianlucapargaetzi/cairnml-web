name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the lint gate needs the base commit of a pull request

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for root-absolute app links
        run: sh scripts/check-app-links.sh

      # The repository has a lint backlog, so only new errors in the files a pull request changes fail the job.
      - name: Lint changed files for new errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'src/*.ts' 'src/*.html')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript or HTML files."
            exit 0
          fi
          node scripts/lint-changed.mjs "$RUNNER_TEMP/base" "${FILES[@]}"

      # Checks only the lines this change adds to .scss files (diff against origin/main).
      - name: Check design tokens in changed styles
        run: sh scripts/check-design-tokens.sh

      - name: Run build
        run: pnpm run build

      - name: Check for production build
        run: test -f build/browser/index.html

      - name: Run widget build
        run: pnpm run build-widgets

      - name: Check for widget build
        run: test -f dist/report-widgets/browser/index.html
