name: ci

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the lint gate needs the base commit of a pull request

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for root-absolute app links
        run: sh scripts/check-app-links.sh

      # The web app's API layer is generated from the server's schema: the services, the models and the shared client
      # files must be exactly what the generator writes. A server change that the web app has not taken (or a hand edit)
      # fails here. Regenerate with: python -m apiserver.client_generator generate --target web --out
      # src/app/business-logic (from the server repository, with its main checked out). The schema is the server's
      # main, or the server's branch named like this pull request's branch when there is one (work that spans the
      # server and the web app: give both pull requests the same branch name).
      - name: Pick the server's ref
        id: server-ref
        uses: ./.github/actions/same-named-ref
        with:
          repository: gianlucapargaetzi/cairnml-server

      - name: Check out the server's schema and generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: ${{ steps.server-ref.outputs.ref }}
          path: server
          sparse-checkout: |
            apiserver/__init__.py
            apiserver/schema_rules.py
            apiserver/client_generator
            apiserver/schema/services
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyhocon jinja2
      - name: The web app's API layer equals the generator's output
        run: python -m apiserver.client_generator generate --target web --out src/app/business-logic --check
        env:
          PYTHONPATH: server

      # The hand-written API code must agree with the schema: it reads api-services/*.service.ts, the request and response
      # models and the other src/**/*.ts files (not HTML or .js) and fails on a request path, an API version or an action
      # written by hand, and on a call or model field the schema lacks. scripts/api-allow.txt lists the exemptions (none
      # today). It uses the server checkout above.
      - name: The web app's hand-written API calls agree with the schema
        run: python -m apiserver.client_generator check-web --root src/app/business-logic --allow scripts/api-allow.txt
        env:
          PYTHONPATH: server

      - name: Check for retired product names
        run: sh scripts/check-product-names.sh

      # The repository has a lint backlog, so only new errors in the files a pull request changes fail the job.
      - name: Lint changed files for new errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'src/*.ts' 'src/*.html')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript or HTML files."
            exit 0
          fi
          node scripts/lint-changed.mjs "$RUNNER_TEMP/base" "${FILES[@]}"

      # Checks only the lines this change adds to .scss files (diff against origin/main).
      - name: Check design tokens in changed styles
        run: sh scripts/check-design-tokens.sh

      # The specs listed in angular.json (test "include") must pass. Specs outside that list are not run yet.
      - name: Run unit tests
        run: pnpm exec ng test trains-webapp --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Run build
        run: pnpm run build

      - name: Check for production build
        run: test -f build/browser/index.html

      - name: Run widget build
        run: pnpm run build-widgets

      - name: Check for widget build
        run: test -f dist/report-widgets/browser/index.html
