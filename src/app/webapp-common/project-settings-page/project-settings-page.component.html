@if (fullProject()) {
  <div class="settings-page">
    <section class="settings-section">
      <div class="section-title">General</div>
      <sm-project-general-settings [project]="fullProject()"></sm-project-general-settings>
    </section>

    <section class="settings-section">
      <div class="section-title">Scalar view defaults</div>
      <sm-project-scalar-defaults [projectId]="projectId()"></sm-project-scalar-defaults>
    </section>

    <section class="settings-section">
      <sm-project-queues [projectId]="projectId()"></sm-project-queues>
    </section>

    <section class="settings-section">
      <sm-project-members></sm-project-members>
    </section>

    <div class="settings-footer">
      <button mat-flat-button (click)="save()" [disabled]="general()?.readonly() || general()?.isInvalid() || !dirty()" data-id="saveProjectSettings">Save</button>
    </div>
  </div>
}
