@if (!showButton()) {
  <sm-dialog-template iconClass="al-ico-datasets" header="Create new dataset">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </sm-dialog-template>
} @else {
  <ng-container *ngTemplateOutlet="content"></ng-container>
}
<ng-template #content>
  <div class="content">
    <div class="code">
      <p>
        Create a dataset from the CLI or use one in your Python code.<br>
        A dataset is a Git repository; its files are stored in Git LFS or in DVC storage.<br>
        For more details see the <a [class.dark]="showButton()" href="https://github.com/gianlucapargaetzi/cairnml/blob/main/docs/datasets.md" target="_blank" rel="noopener" data-id="documentationLink">documentation</a>
      </p>
      <div class="navbar">
        <mat-tab-group [(selectedIndex)]="index">
          <mat-tab label="CLI" data-id="CLITab"></mat-tab>
          <mat-tab label="SDK" data-id="SDKTab"></mat-tab>
        </mat-tab-group>
      </div>
      @if (showCode()) {
        <sm-code-editor
          [code]="emptyStateTab() === 'cli' ? initDatasetCLICode: initDatasetSDKCode"
          [readonly]="true"
          [mode]="emptyStateTab() === 'cli' ? 'sh': 'python'"
          [showCopyButton]="true"
        ></sm-code-editor>
      }
    </div>
    <div class="diagram"><i class="i-datasets-empty-state" data-id="emptyDataSetDiagram"></i></div>
  </div>
</ng-template>
