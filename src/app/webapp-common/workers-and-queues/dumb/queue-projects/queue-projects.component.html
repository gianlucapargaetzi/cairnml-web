@if (error()) {
  <div class="projects-error" role="alert">{{ error() }}</div>
} @else if (projects() === null) {
  <mat-progress-spinner aria-label="Loading" class="loading" mode="indeterminate" [diameter]="24" [strokeWidth]="2"></mat-progress-spinner>
} @else if (projects().length === 0) {
  <div class="empty">No projects are allocated to this queue. Project owners allocate queues in the project settings.</div>
} @else {
  <ul class="projects-list">
    @for (project of projects(); track project.id) {
      <li>
        <sm-entity-chip [label]="project.name" [link]="['/projects', project.id, 'overview']"></sm-entity-chip>
      </li>
    }
  </ul>
}
