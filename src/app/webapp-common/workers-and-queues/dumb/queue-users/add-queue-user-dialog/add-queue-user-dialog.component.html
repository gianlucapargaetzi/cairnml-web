<sm-dialog-template iconClass="al-ico-add" header="Add user">
  <div class="form">
    <mat-form-field appearance="outline">
      <mat-label>User</mat-label>
      <mat-select [value]="user()" (selectionChange)="user.set($event.value)" data-id="queueUser">
        @for (item of data.users; track item.id) {
          <mat-option [value]="item.id">{{ item.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="actions">
      <button mat-stroked-button type="button" (click)="cancel()" data-id="cancelAddQueueUser">Cancel</button>
      <button mat-flat-button type="button" [disabled]="!user()" (click)="apply()" data-id="confirmAddQueueUser">Add user</button>
    </div>
  </div>
</sm-dialog-template>
