<sm-dialog-template iconClass="al-ico-add" header="Add user">
  <div class="content">
    <mat-form-field floatLabel="always">
      <mat-label>User</mat-label>
      <mat-select [value]="user()" (selectionChange)="user.set($event.value)" data-id="queueUser">
        @for (item of data.users; track item.id) {
          <mat-option [value]="item.id">{{ item.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <mat-dialog-actions>
    <button mat-stroked-button (click)="cancel()" data-id="cancelAddQueueUser">Cancel</button>
    <button mat-flat-button [disabled]="!user()" (click)="apply()" data-id="confirmAddQueueUser">Apply</button>
  </mat-dialog-actions>
</sm-dialog-template>
