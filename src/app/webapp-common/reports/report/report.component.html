<sm-page-header [title]="report()?.name ?? ''">
  @if ((editMode$ | ngrxPush) !== true) {
    <div actions class="actions">
      <sm-tag-list
        [tags]="report()?.tags"
        (add)="openTagMenu($event, tagsMenuTrigger, tagsMenu)"
        (remove)="removeTag($event)"
      ></sm-tag-list>
      <div class="g-btns">
        <button aria-label="Copy report markdown" mat-icon-button smTooltip="Copy report markdown to clipboard" data-id="copyReportMarkdownButton" (click)="copyMarkdown()">
          <mat-icon fontSet="al" fontIcon="al-ico-copy-to-clipboard"></mat-icon>
        </button>
        <button aria-label="Export to PDF" mat-icon-button smTooltip="Export to PDF" data-id="reportExportToPdfButton" (click)="printReport()">
          <mat-icon fontSet="al" fontIcon="al-ico-pdf"></mat-icon>
        </button>
        <button #printHiddenButton  class="hidden" ngxPrint printSectionId="print-element-temp" [printDelay]="3000" [useExistingCss]="true" [printStyle]="printStyle">
        </button>
        <button aria-label="Share" mat-icon-button data-id="shareReportButton" (click)="share()" smTooltip="Share">
          <mat-icon fontSet="al" fontIcon="al-ico-shared-item"></mat-icon>
        </button>
        <button aria-label="Move to project" mat-icon-button data-id="reportMoveToProjectButton" (click)="moveToProject()" smTooltip="Move to Project">
          <mat-icon fontSet="al" fontIcon="al-ico-move-to"></mat-icon>
        </button>
        <button [attr.aria-label]="archived() ? 'Restore' : 'Archive'" mat-icon-button data-id="archiveReportButton" (click)="archive()" [smTooltip]="archived() ? 'Restore' : 'Archive'">
          <mat-icon fontSet="al" [fontIcon]="archived() ? icons.RESTORE : icons.ARCHIVE"></mat-icon>
        </button>
        @if (archived()) {
          <button aria-label="Delete" mat-icon-button data-id="deleteReportButton" (click)="deleteReport()" smTooltip="Delete">
            <mat-icon fontSet="al" fontIcon="al-ico-trash"></mat-icon>
          </button>
        }
        @if (draft()) {
          <button mat-flat-button
            data-id="publishReportButton"
            [disabled]="!this.report()?.report?.trim()"
            [smTooltip]="!this.report()?.report?.trim() ? 'Can\'t publish an empty report' : ''"
            (click)="publish()"
            >
            <mat-icon fontSet="al" fontIcon="al-ico-publish"></mat-icon>
            Publish
          </button>
          }
        </div>
        <span
          #tagsMenuTrigger="matMenuTrigger"
          [matMenuTriggerFor]="tagsMenu.matMenu()"
          (menuClosed)="tagsMenu.clear()"
          class="trigger"
          [style.left.px]="menuPosition.x"
          [style.top.px]="menuPosition.y"
        ></span>
        <sm-tags-menu
          #tagsMenu
          [tags]="report()?.tags"
          [projectTags]="reportTags$ | ngrxPush"
          [companyTags]="null"
          [filterByProject]="true"
          (tagSelected)="addTag($event)"
        ></sm-tags-menu>
      </div>
    }
</sm-page-header>
  @if (report()) {
    <div class="content report">
      @if (!editor.editMode) {
        <div class="hover-button">
          <button mat-stroked-button data-id="reportDescriptionButton" class="description-button" (click)="showDescription = !showDescription">
            <mat-icon fontSet="al" fontIcon="al-ico-caret-right" [class.open]="drawer.opened"></mat-icon>
            Description
            <mat-icon iconPositionEnd fontSet="al" fontIcon="al-ico-caret-right" [class.open]="drawer.opened"></mat-icon>
          </button>
        </div>
      }
      <mat-drawer-container class="h-100">
        <mat-drawer
          #drawer
          [mode]="(smallScreen$ | ngrxPush) ? 'over' : 'side'"
          [opened]="!editor.editMode && showDescription"
          (closed)="showDescription = false"
          >
          <div class="description">
            @if (!example() && report() && !editDesc) {
              <button mat-stroked-button
                data-id="editReportDescription"
                class="edit-button"
                (click)="editReportDesc(descElement)"
                >Edit
              </button>
            }
            <textarea
              placeholder="Report description"
              #descElement
              [disabled]="!editDesc"
              (keyup)="cdr.detectChanges()"
            >{{report()?.comment || ''}}</textarea>
            @if (editDesc) {
              <div class="buttons">
                <button mat-stroked-button data-id="cancelButton" (click)="descElement.value = orgDesc; editDesc = false">Cancel</button>
                <button mat-flat-button data-id="saveButton" [disabled]="orgDesc === descElement.value" (click)="saveDesc(descElement.value)">Save</button>
              </div>
            }
          </div>
        </mat-drawer>
        <mat-drawer-content>
          <sm-markdown-editor
            #editor
            [class.edit]="editor.editMode || !report()?.report"
            [class.full-width]="widthExpanded"
            [data]="report()?.['report'] ?? ''"
            [readOnly]="!draft() || example()"
            [resources]="resources()"
            [handleUpload]="handleUpload"
            [blockUserScripts]="blockUserScripts$ | ngrxPush"
            (saveInfo)="save($event)"
            (editModeChanged)="editModeChanged();"
            (dirtyChanged)="dirtyChanged($event);"
            (deleteResource)="deleteResource($event)"
            (imageMenuOpened)="calculateUnusedResources($event)"
            >
            @if (!example() && report() && draft()) {
              <div no-data class="flex-middle empty-state">
                <mat-icon fontSet="al" fontIcon="al-ico-reports" class="al-icon xxl"></mat-icon>
                <div class="no-data-title">There's nothing here yet…</div>
                <button mat-flat-button data-id="editReportButton" (click)="editor.editClicked()">
                  <span>Start editing the report</span>
                </button>
              </div>
            }
          </sm-markdown-editor>
        </mat-drawer-content>
      </mat-drawer-container>
    </div>
  }
