@if (selectedStorage()) {
  <sm-page-header [title]="storageNames[selectedStorage()] + ' storage credentials'">
    <button back aria-label="Back" mat-icon-button (click)="cancelChanges(); selectedStorage.set(null)">
      <mat-icon fontSet="al" fontIcon="al-ico-arrow-left" data-id="backStorage"></mat-icon>
    </button>
    <button actions mat-stroked-button
            type="button"
            [disabled]="storageForm.pristine"
            (click)="cancelChanges()" data-id="resetChangesButton">Reset changes
    </button>
    <button actions mat-flat-button
            type="submit"
            [disabled]="storageForm.invalid || (storageForm.pristine)"
            (click)="save()" data-id="saveButton">
      <div class="button">
        @if (saving()) {
          <mat-progress-spinner mode="indeterminate" [diameter]="20" [strokeWidth]="2" class="me-2"></mat-progress-spinner>
        } @else if (saved()) {
          <mat-icon fontSet="al" fontIcon="al-ico-success" class="me-2">check</mat-icon>
        }
        Save
      </div>
    </button>
  </sm-page-header>
}
<form [formGroup]="storageForm" (ngSubmit)="onSubmit()">
  @switch (selectedStorage()) {
    @case ('google') {
      <sm-google-storage-credentials
        formGroupName="google"
        (save)="save()"
        (cancelClicked)="cancelChanges()">
      </sm-google-storage-credentials>
    }
    @case ('aws') {
      <sm-aws-storage-credentials
        formGroupName="aws"
        (save)="save()"
        (cancelClicked)="cancelChanges()">
      </sm-aws-storage-credentials>
    }
    @case ('azure') {
      <sm-azure-storage-credentials
        formGroupName="azure"
        (save)="save()"
        (cancelClicked)="cancelChanges()">
      </sm-azure-storage-credentials>
    }
    @default {
      <div class="storage-title">Storage Providers</div>
      <div class="storage-desc">Configure storage provider access credentials to enable CairnML to delete artifacts stored in cloud storage when tasks or models are deleted.</div>
      <div class="storage-options">
        <button type="button" class="tablet google" (click)="selectedStorage.set('google')">
          <i class="al-icon i-google-cloud xxl"></i>
          <span class="tablet-title">Google Cloud Storage</span>
          @if (storageForm.controls.google.controls.credentials_json.value || storageForm.controls.google.controls.buckets.controls.length) {
            <span class="active-badge"><mat-icon fontSet="al" fontIcon="al-ico-success" class="al-icon sm-md me-2"></mat-icon>Configured</span>
          }
        </button>
        <button type="button" class="tablet aws" (click)="selectedStorage.set('aws')">
          <i class="al-icon i-aws-cloud xxl"></i>
          <span class="tablet-title">AWS S3 Storage</span>
          <span class="subtitle">(Use for <i class="al-icon i-minio xl"></i> as well)</span>
          @if (storageForm.controls.aws.controls.key.value || storageForm.controls.aws.controls.buckets.controls.length) {
            <span class="active-badge"><mat-icon fontSet="al" fontIcon="al-ico-success" class="al-icon sm-md me-2"></mat-icon>Configured</span>
          }
        </button>
        <button type="button" class="tablet azure" (click)="selectedStorage.set('azure')">
          <i class="al-icon i-azure-cloud xxl"></i>
          <span class="tablet-title">Azure Blob Storage</span>
          @if (storageForm.controls.azure.controls.containers.controls.length) {
            <span class="active-badge"><mat-icon fontSet="al" fontIcon="al-ico-success" class="al-icon sm-md me-2"></mat-icon>Configured</span>
          }
        </button>
      </div>
    }
  }
</form>
