<div class="h-100" [class]="codeEnabled() ? 'code' : 'no-code'">
  <div class="choose-container" [class.open-code]="codeOpen() && codeEnabled()" (click)="chooseClicked.emit()" tabindex="0" role="button" (keydown.enter)="$event.target === $event.currentTarget && (chooseClicked.emit())" (keydown.space)="$event.target === $event.currentTarget && (chooseClicked.emit()); $event.target === $event.currentTarget && $event.preventDefault()"
  ><ng-content></ng-content></div>
  <div class="code-container" [class.open-code]="codeOpen() && codeEnabled()"><ng-content select="[sm-code]"></ng-content></div>
</div>
