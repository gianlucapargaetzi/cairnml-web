<div class="d-flex justify-content-between sp-mb-2">
  <span class="font-weight-bold">{{ titleLabel() }}</span>
</div>
<sm-search
  [value]="searchTerm()"
  [minimumChars]="0"
  [debounceTime]="0"
  class="underline-search"
  [placeholder]="placeHolder()"
  (valueChanged)="onSearchTermChanged($event)"
></sm-search>
<div class="toggle-all-text">
  @if (searchTerm()) {
    <span (click)="toggleHideMatching()" data-id="hideShowMatchingButton" tabindex="0" role="button" (keydown.enter)="$event.target === $event.currentTarget && (toggleHideMatching())" (keydown.space)="$event.target === $event.currentTarget && (toggleHideMatching()); $event.target === $event.currentTarget && $event.preventDefault()"
    >{{ allFilteredSelected() ? 'Hide matching' : 'Show matching' }}</span>
  } @else {
  <span (click)="toggleHideAll()" data-id="hideShowAllButton" tabindex="0" role="button" (keydown.enter)="$event.target === $event.currentTarget && (toggleHideAll())" (keydown.space)="$event.target === $event.currentTarget && (toggleHideAll()); $event.target === $event.currentTarget && $event.preventDefault()"
  >{{ allSelected() ? 'Hide all' : 'Show all' }}</span>
  }
</div>
<div class="toggle-all-text">
</div>
<sm-grouped-selectable-list
  [filteredList]="filteredList()"
  [fullList]="listNested()"
  [searchTerm]="searchTerm()"
  [checkedList]="checkedList()"
  (itemSelect)="itemSelect.emit($event)"
  (itemCheck)="toggleHide($event)"
  (groupChecked)="toggleHideGroup($event)"
  data-id="toggleGraphList"
></sm-grouped-selectable-list>
