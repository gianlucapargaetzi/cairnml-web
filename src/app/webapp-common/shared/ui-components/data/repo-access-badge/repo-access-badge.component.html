@if (access(); as access) {
  <span class="repo-access" [class.ok]="ok()" [class.refused]="refused()" [class.warned]="warned()" [smTooltip]="access.message || label()"
    [attr.aria-label]="label()" data-id="repoAccessBadge">
    <mat-icon fontSet="al" [fontIcon]="icon()" class="al-icon"></mat-icon>
    @if (!iconOnly()) {
      <span>{{ label() }}</span>
    }
  </span>
}
