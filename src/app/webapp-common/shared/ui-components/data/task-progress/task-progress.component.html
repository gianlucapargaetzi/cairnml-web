@if (running()) {
  @switch (mode()) {
    @case ('mini') {
      <div class="track" [class.idle]="idle()" role="progressbar" [attr.aria-label]="idle() ? 'Working' : 'Progress'"
           [attr.aria-valuenow]="percent()" aria-valuemin="0" aria-valuemax="100">
        @if (!idle()) {
          <div class="fill" [style.width.%]="percent()"></div>
        }
      </div>
      @if (percent() !== null) {
        <span class="percent">{{ percent() }}%</span>
      }
    }
    @case ('full') {
      @for (row of rows(); track $index) {
        <div class="level" [class.inner]="!row.main" data-id="progressBar">
          <div class="text">{{ row.text }}</div>
          <div class="track" [class.idle]="row.percent === null" role="progressbar" [attr.aria-label]="row.label"
               [attr.aria-valuenow]="row.percent" aria-valuemin="0" aria-valuemax="100">
            @if (row.percent !== null) {
              <div class="fill" [style.width.%]="row.percent"></div>
            }
          </div>
        </div>
      }
    }
  }
}
