<sm-dialog-template iconClass="al-ico-add" header="Add dataset">
  <div class="form">
    <mat-form-field appearance="outline">
      <mat-label>Datasets</mat-label>
      <mat-select multiple [value]="ids()" (selectionChange)="ids.set($event.value)" data-id="projectDatasets">
        @for (dataset of data.datasets; track dataset.id) {
          <mat-option [value]="dataset.id">{{ dataset.name }}{{ dataset.visibility === 'Public' ? ' (public)' : '' }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="actions">
      <button mat-stroked-button type="button" (click)="cancel()" data-id="cancelAddProjectDatasets">Cancel</button>
      <button mat-flat-button type="button" [disabled]="!ids().length" (click)="apply()" data-id="confirmAddProjectDatasets">Add dataset</button>
    </div>
  </div>
</sm-dialog-template>
