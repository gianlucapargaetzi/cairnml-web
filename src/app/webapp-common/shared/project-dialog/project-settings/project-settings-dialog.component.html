<sm-dialog-template
  iconClass="al-ico-projects"
  [header]="dialogTitle()"
  headerClass="no-uppercase"
>

  <mat-tab-group
    preserveContent
    [mat-stretch-tabs]="false"
    mat-align-tabs="center"
    class="with-border"
    [dynamicHeight]="true"
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="tabChanged($event)"
  >

    <mat-tab label="General">
      <ng-template mat-tab-label>
        General
        @if (general().isInvalid()) {
          <span class="invalid-dot"></span>
        }
      </ng-template>
      <sm-project-general-settings class="data-project" [project]="data.project" (cancelled)="closeDialog()"></sm-project-general-settings>
    </mat-tab>

    <mat-tab label="Scalar view defaults">
      <sm-project-scalar-defaults [projectId]="data.project.id"></sm-project-scalar-defaults>
    </mat-tab>
    <mat-tab label="Users">
      <sm-project-members></sm-project-members>
    </mat-tab>
    <mat-tab label="Queues">
      <sm-project-queues class="section" [projectId]="data.project.id"></sm-project-queues>
    </mat-tab>
    @for (tab of extraTabs(); track tab) {
      <mat-tab [label]="tab.textLabel">
        <ng-template [cdkPortalOutlet]="tab.content"></ng-template>
      </mat-tab>
    }
    <ng-content></ng-content>
  </mat-tab-group>


  @if (!isEditing()){
    <mat-dialog-actions>
    <button mat-stroked-button (click)="closeDialog()" data-id="Cancel">Cancel</button>
    <button mat-flat-button (click)="save()" [disabled]="general().readonly() || general().isInvalid() || (!scalars().hasChanges() && !general().hasChanges() && !extraDirty())" data-id="Save">
      Save
    </button>
  </mat-dialog-actions>
  }
</sm-dialog-template>
