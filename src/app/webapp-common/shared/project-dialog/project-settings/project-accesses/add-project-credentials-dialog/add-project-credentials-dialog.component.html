<sm-dialog-template iconClass="al-ico-add" header="Add credentials">
  <div class="content">
    <mat-form-field floatLabel="always">
      <mat-label>Credentials</mat-label>
      <mat-select multiple [value]="ids()" (selectionChange)="ids.set($event.value)" data-id="projectCredentials">
        @for (credential of data.credentials; track credential.id) {
          <mat-option [value]="credential.id">{{ credential.name }}{{ credential.host ? ' (' + credential.host + (credential.path ? '/' + credential.path : '') + ')' : '' }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <mat-dialog-actions>
    <button mat-stroked-button (click)="cancel()" data-id="cancelAddProjectCredentials">Cancel</button>
    <button mat-flat-button [disabled]="!ids().length" (click)="apply()" data-id="confirmAddProjectCredentials">Add credential</button>
  </mat-dialog-actions>
</sm-dialog-template>
