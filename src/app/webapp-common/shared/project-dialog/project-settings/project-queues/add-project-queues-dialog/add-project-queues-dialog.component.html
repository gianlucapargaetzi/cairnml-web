<sm-dialog-template iconClass="al-ico-add" header="Add queue">
  <div class="form">
    <mat-form-field appearance="outline">
      <mat-label>Queues</mat-label>
      <mat-select multiple [value]="queues()" (selectionChange)="queues.set($event.value)" data-id="projectQueues">
        @for (queue of data.queues; track queue.id) {
          <mat-option [value]="queue.id">{{ queue.name }}{{ queue.public ? ' (public)' : '' }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="actions">
      <button mat-stroked-button type="button" (click)="cancel()" data-id="cancelAddProjectQueues">Cancel</button>
      <button mat-flat-button type="button" [disabled]="!queues().length" (click)="apply()" data-id="confirmAddProjectQueues">Add queue</button>
    </div>
  </div>
</sm-dialog-template>
