<div tabindex="0" role="button" (click)="optionClicked.emit($event)" (keydown.enter)="$event.target === $event.currentTarget && (optionClicked.emit($any($any($event))))" (keydown.space)="$event.target === $event.currentTarget && (optionClicked.emit($any($any($event)))); $event.target === $event.currentTarget && $event.preventDefault()" class="project-option-row">
  <mat-checkbox [checked]="selected()" (change)="toggleSelection.emit()"
                (click)="$event.stopPropagation()"></mat-checkbox>
  <div class="ellipsis" smShowTooltipIfEllipsis [smTooltip]="project().name" [smSearchText]="searchedText()">{{ project().name }}</div>
</div>
