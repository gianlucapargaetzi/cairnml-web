<div class="sm-card-list-layout">
  <div #header class="sm-card-list-header">
    <div class="recent-title">Recent projects
      <button mat-button class="view-all" (click)="router.navigateByUrl('/projects')" data-id="viewAllProjects">View all</button>
    </div>
    <button
      mat-flat-button
      data-id="New Project"
      (click)="openCreateProjectDialog()">
      <mat-icon fontSet="al" fontIcon="al-ico-add"></mat-icon>
      New project
    </button>
  </div>
  @if (recentProjectsList$(); as recentProjectsList) {
    @for(project of recentProjectsList; track project.id) {
      <sm-project-card
        [project]="project" (dblclick)="projectCardClicked(project)"
        (keydown.enter)="projectCardKeyActivated($event, project)"
        [settingsOnly]="true"
        (projectSettingsClicked)="openProjectSettings($event)"
      ></sm-project-card>
    }
    @if (recentProjectsList.length < cardsInRow) {
      <sm-plus-card
        [folder]="true"
        (plusCardClick)="openCreateProjectDialog()"
      ></sm-plus-card>
    }
  }
</div>
