<div class="info-content" [class.h-100]="descriptionEditor()?.editMode">
  @for (panel of visiblePanels(); track panel.id) {
    @switch (panel.id) {
      @case ('metric-snapshot') {
        <div class="metric-panel" [class.open]="panelOpen()">
          <mat-expansion-panel (opened)="setMetricsPanel(true)" (closed)="setMetricsPanel(false)" [expanded]="panelOpen()">
            <mat-expansion-panel-header expandedHeight="48px" collapsedHeight="48px">
              <mat-panel-title>
                Metric Snapshot
              </mat-panel-title>
            </mat-expansion-panel-header>
            <ng-template matExpansionPanelContent>
              <sm-project-stats [project]="project()"></sm-project-stats>
            </ng-template>
          </mat-expansion-panel>
        </div>
      }
      @case ('contribution') {
        <sm-project-contribution
          [projectId]="projectId()"
          [periodDays]="contributionOptions.periodDays"
          [topContributors]="contributionOptions.topContributors"
        ></sm-project-contribution>
      }
      @case ('description') {
        <sm-markdown-editor
          #descriptionEditor
          [class.editor]="descriptionEditor.editMode"
          [data]="info()"
          [readOnly]="example()"
          [blockUserScripts]="blockUserScripts()"
          (saveInfo)="saveInfo($event)"
          >
          @if (!example()) {
            <div no-data class="flex-middle overview-placeholder">
              <i class="al-icon al-ico-no-data-markdown xxl"></i>
              <div class="no-data-title">There’s nothing here yet…</div>
              <button mat-flat-button (click)="descriptionEditor.editClicked()">
                <span>Add project overview</span>
              </button>
            </div>
          }
        </sm-markdown-editor>
      }
    }
  }
</div>
