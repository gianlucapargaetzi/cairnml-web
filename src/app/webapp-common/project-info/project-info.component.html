<div class="info-content">
  @if (!ready()) {
    <div class="loading"><mat-spinner [diameter]="24" [strokeWidth]="3" aria-label="Loading the board"></mat-spinner></div>
  } @else {
    @let board = state();
    @if (canEdit()) {
      <div class="board-toolbar">
        @if (board.saving()) {
          <span class="meta" data-id="boardSaving">Saving…</span>
        }
        <button mat-icon-button type="button" data-id="boardEditToggle" [class.active]="board.editing()"
                [attr.aria-pressed]="board.editing()" [attr.aria-label]="board.editing() ? 'Done editing the board' : 'Edit the board'"
                [smTooltip]="board.editing() ? 'Done' : 'Edit the board'" (click)="toggleEditing()">
          <mat-icon fontSet="al" [fontIcon]="board.editing() ? 'al-ico-success' : 'al-ico-edit'"></mat-icon>
        </button>
      </div>
    }
    @if (board.conflict()) {
      <sm-inline-alert severity="warning" data-id="boardConflict">
        The board was changed by someone else. Your latest changes were not saved.
        <button action mat-button type="button" data-id="boardReload" (click)="board.reload()">Reload the board</button>
      </sm-inline-alert>
    } @else if (board.error()) {
      <sm-inline-alert severity="error" data-id="boardError">{{ board.error() }}</sm-inline-alert>
    }
    <sm-board-grid [cards]="board.board().cards" [editable]="board.editing()" (cardsChange)="board.updateCards($event)">
      <ng-template #card let-card>
        <sm-board-card [card]="card" [projectId]="projectId()!" [editing]="board.editing()" (edit)="editCard(card)"
                       (remove)="board.removeCard(card.id)" [autoFit]="fitting().has(card.id)" (fit)="fitCard(card, $event)"></sm-board-card>
      </ng-template>
    </sm-board-grid>
    @if (board.editing()) {
      <button type="button" class="board-add-card" data-id="boardAddCard" (click)="addCard()">
        <mat-icon fontSet="al" fontIcon="al-ico-add"></mat-icon>
        Add card
      </button>
    }
  }
</div>
