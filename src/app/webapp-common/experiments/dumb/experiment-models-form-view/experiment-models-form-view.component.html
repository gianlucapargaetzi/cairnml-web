<div class="input-model-container">
  <sm-labeled-row label="Model name">
    <div class="d-flex align-items-center">
      <div class="d-flex-center">
        <a [routerLink]="['/projects', projectId(), 'models', model()?.id]" target="_blank"><span>{{model()?.name}}</span></a>
        @if (model()?.uri && !isLocalFile()) {
          <button aria-label="Download model" mat-icon-button (click)="artifactFilePathClicked(model().uri)">
            <mat-icon fontSet="al" fontIcon="al-ico-download"></mat-icon>
          </button>
        }
        @if (model()?.uri && isLocalFile()) {
          <sm-copy-clipboard
            label="" [clipboardText]="model().uri"
          ></sm-copy-clipboard>
        }
      </div>
      @if (editable()) {
        <button aria-label="Select model" mat-icon-button smTooltip="Select model" class="sp-ms-3" data-id="selectModelButton" (click)="chooseModel()">
          <mat-icon fontSet="al" fontIcon="al-ico-edit"></mat-icon>
        </button>
        @if (model()?.id) {
          <button aria-label="Remove model" mat-icon-button class="sp-ms-3" smTooltip="Remove model" (click)="removeModel()">
            <mat-icon fontSet="al" fontIcon="al-ico-trash"></mat-icon>
          </button>
        }
      }
    </div>
  </sm-labeled-row>
  @if (model()?.id) {
    <sm-labeled-row label="Model ID">
      <sm-id-badge [id]="model().id" (copied)="copySuccess()"></sm-id-badge>
    </sm-labeled-row>
  }
  @if (showCreatedExperiment()) {
    <sm-labeled-row label="Creating task">
      <a [routerLink]="['/projects', source()?.projectId || '*', 'experiments', source()?.experimentId ?? '']"
        target="_blank">
        {{source()?.experimentName}}
      </a>
    </sm-labeled-row>
  }
</div>
