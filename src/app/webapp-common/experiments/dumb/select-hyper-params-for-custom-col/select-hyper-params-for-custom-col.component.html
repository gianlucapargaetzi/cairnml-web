<div smClickStopPropagation class="head">

  ></mat-icon>
  <h3>Select hyperparameters to display</h3>
</div>
<sm-grouped-checked-filter-list
  smClickStopPropagation
  [itemsList]="hyperParams"
  [selectedItemsList]="metricsCols"

></sm-grouped-checked-filter-list>
