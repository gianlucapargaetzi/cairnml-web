@if (graphData()?.length > 0) {
  <div class="buttons">
    <button aria-label="Download" mat-icon-button smTooltip="Download" (click)="downloadImage()">
      <mat-icon fontSet="al" fontIcon="al-ico-download"></mat-icon>
    </button>
  </div>
}
<sm-scatter-plot
  [xAxisType]="scalar() ? 'linear' : 'category'"
  [xAxisLabel]="xAxisLabel()"
  [yAxisLabel]="metricName()"
  [extraHoverInfoParams]="extraHoverInfoParams()"
  [data]="graphData()"
></sm-scatter-plot>
