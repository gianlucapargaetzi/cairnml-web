<div class="no-data-center">
  <mat-icon fontSet="al" fontIcon="al-ico-model-endpoints" class="xxl"></mat-icon>
  @if (isLoading()) {
    <span class="message">Loading model endpoints</span>
  } @else {
    <span class="message">No active model endpoints</span>
    <span class="sub-message">This page lists running model endpoints. CairnML has no button to create one. Endpoints are created in a task with the SDK HttpRouter.</span>
  }
</div>
