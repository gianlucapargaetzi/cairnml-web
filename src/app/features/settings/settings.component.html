<ng-template #menuItems>
  <mat-list class="pointer" style="padding-top: 24px;">
    <mat-list-item routerLinkActive="active" routerLink="profile">Profile</mat-list-item>
    <mat-list-item routerLinkActive="active" routerLink="webapp-configuration">Configuration</mat-list-item>
    <mat-list-item routerLinkActive="active" routerLink="devices">Devices</mat-list-item>
    @if (isAdmin()) {
      <mat-list-item routerLinkActive="active" routerLink="git-credentials">Git Credentials</mat-list-item>
    }
    <mat-list-item routerLinkActive="active" routerLink="storage-credentials">Storage Cleanup</mat-list-item>
  </mat-list>
</ng-template>

<ng-template #pageContent>
  <div class="section">
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
  <sm-admin-footer></sm-admin-footer>
</ng-template>

@if (narrowScreen()) {
  <div class="settings-stacked">
    <div class="settings-stacked-menu">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </div>
    <div class="settings-stacked-content">
      <ng-container *ngTemplateOutlet="pageContent"></ng-container>
    </div>
  </div>
} @else {
  <mat-drawer-container class="settings-container">
    <mat-drawer mode="side" opened>
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </mat-drawer>
    <mat-drawer-content>
      <ng-container *ngTemplateOutlet="pageContent"></ng-container>
    </mat-drawer-content>
  </mat-drawer-container>
}
