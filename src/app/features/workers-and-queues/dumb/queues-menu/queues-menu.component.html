@if (menuOpen()) {
  <sm-menu
    [position]="menuPosition()"
    [header]=""
    [showCart]="false"
    [showOverlay]="false"
    [openOnInit]="true"
  >
    @if (canManage()) {
      <sm-menu-item
        itemLabel="Clear"
        (itemClicked)="clearQueue.emit(selectedQueue())"
        [disabled]="selectedQueue()?.entries_count === 0"
      ></sm-menu-item>
    }
  </sm-menu>
}
